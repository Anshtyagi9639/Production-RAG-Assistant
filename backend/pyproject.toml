[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-backend"
version = "0.1.0"
description = "Backend API and worker for the AI Knowledge & Operations Copilot"
requires-python = ">=3.12"
# requirements.txt stays the single list of pins. Vercel installs a Python service from this
# file when it exists, so the dependencies are read from requirements.txt.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# Installing this project only installs its dependencies; the code runs from the source tree.
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Blocking file access in async tests is fine; asserts and fixed test secrets are expected.
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
# boto3 ships without type information.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration and not live'"
markers = [
    "integration: needs MongoDB Atlas (and Redis for the queue tests); run with -m integration",
    "live: calls the real OpenAI API and Qdrant Cloud (costs credits); run with -m live",
]
filterwarnings = [
    # Tests use qdrant-client's in-process mode, where payload indexes are a no-op.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
