[project]
name = "copilot-backend"
version = "0.1.0"
description = "Backend API and worker for the AI Knowledge & Operations Copilot"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations; the import name refers to the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs running postgres, redis and qdrant (run with -m integration)"]
